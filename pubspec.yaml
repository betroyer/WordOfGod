name: faithpath
description: FaithPath — Bible study companion with online AI assistant.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  drift: ^2.26.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.32
  shared_preferences: ^2.5.3
  dio: ^5.8.0+1
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.1.1
  intl: ^0.20.2
  share_plus: ^11.0.0
  path_provider: ^2.1.5
  file_picker: ^10.1.2
  uuid: ^4.5.1
  collection: ^1.19.1
  path: ^1.9.1
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.26.1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/bible/en_kjv.json
